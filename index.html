<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>张楚乔医生客户随访管理</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .vip-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.15) 0%, rgba(251, 146, 60, 0.15) 100%);
            border: 1px solid rgba(251, 191, 36, 0.3);
            border-radius: 12px;
            color: rgba(251, 191, 36, 0.9);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 24px;
            transition: all 0.2s ease;
        }
        .vip-link:hover {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.25) 0%, rgba(251, 146, 60, 0.25) 100%);
            border-color: rgba(251, 191, 36, 0.5);
            transform: translateY(-1px);
        }
        .vip-link::before {
            content: '★';
        }
        .client-name-link {
            cursor: pointer;
            text-decoration: underline;
            text-decoration-color: rgba(102, 126, 234, 0.6);
            transition: all 0.2s ease;
        }
        .client-name-link:hover {
            color: #667eea;
            text-decoration-color: #667eea;
        }
        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(0, 255, 255, 0.15);
        }
        .logout-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: rgba(255, 0, 80, 0.15);
            border: 1px solid rgba(255, 0, 80, 0.3);
            border-radius: 8px;
            color: #ff5080;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .logout-btn:hover {
            background: rgba(255, 0, 80, 0.25);
            border-color: #ff5080;
            box-shadow: 0 0 15px rgba(255, 0, 80, 0.3);
        }
        .logout-btn::before {
            content: '× ';
            font-size: 16px;
        }
        /* 上传图片展示区域 */
        .uploaded-images {
            margin-top: 24px;
        }
        .images-title {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 16px;
        }
        .images-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }
        .image-item {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .image-item img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            cursor: pointer;
        }
        .image-item img:hover {
            opacity: 0.8;
        }
        .image-info {
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
        }
        .image-type {
            font-size: 12px;
            color: rgba(0, 255, 255, 0.8);
            margin-bottom: 4px;
        }
        .image-time {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
        }
        .delete-image-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(239, 68, 68, 0.9);
            border: none;
            color: white;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .image-item:hover .delete-image-btn {
            opacity: 1;
        }
        .delete-image-btn:hover {
            background: rgba(239, 68, 68, 1);
        }
        .no-uploaded-images {
            text-align: center;
            padding: 40px 20px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
        }
        /* 文件预览样式 */
        .file-preview {
            width: 100%;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 255, 255, 0.05);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .file-preview:hover {
            background: rgba(0, 255, 255, 0.1);
        }
        .file-icon {
            font-size: 48px;
        }
        .file-name {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        /* 复制按钮样式 */
        .copy-btn:hover {
            background: rgba(0, 255, 255, 0.25) !important;
            border-color: rgba(0, 255, 255, 0.6) !important;
        }
        /* 识别结果卡片样式 */
        .recognition-result-card {
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        /* 图片模态框样式 */
        .image-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            animation: fadeIn 0.2s ease;
        }
        .image-modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .image-modal-content {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
            animation: zoomIn 0.2s ease;
        }
        .image-modal-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.2s ease;
            z-index: 1001;
        }
        .image-modal-close:hover {
            color: #00ffff;
        }
        .image-modal-info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 20px;
            z-index: 1001;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes zoomIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <!-- 简洁的科幻装饰 -->
    <div class="tech-grid"></div>
    <div class="holo-scan"></div>

    <!-- HUD 角落装饰 -->
    <div class="hud-corner top-left"></div>
    <div class="hud-corner top-right"></div>
    <div class="hud-corner bottom-left"></div>
    <div class="hud-corner bottom-right"></div>

    <!-- 图片模态框 -->
    <div id="imageModal" class="image-modal">
        <span class="image-modal-close" onclick="closeImageModal()">&times;</span>
        <img id="modalImage" class="image-modal-content" src="" alt="原图">
        <div id="modalImageInfo" class="image-modal-info"></div>
    </div>

    <div class="container">
        <div class="header-nav">
            <a href="vip.html" class="vip-link">大客户管理</a>
            <button class="logout-btn" onclick="logout()">登出</button>
        </div>
        <h1>张楚乔医生客户随访管理</h1>

        <div class="card">
            <h2>添加客户</h2>
            <form id="clientForm">
                <div class="form-group">
                    <label>客户姓名</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label>干预项目</label>
                    <input type="text" id="intervention" required placeholder="例如：营养补充、生活方式调整">
                </div>
                <div class="form-group">
                    <label>干预时间</label>
                    <input type="datetime-local" id="interventionTime" required>
                </div>
                <div class="form-group">
                    <label>提醒时间</label>
                    <input type="datetime-local" id="reminderTime" required>
                </div>
                <div class="form-group">
                    <label>注意事项</label>
                    <input type="text" id="notes" placeholder="例如：重点关注的健康指标、过敏信息等">
                </div>
                <button type="submit">添加</button>
            </form>
        </div>

        <div class="card">
            <h2>📄 医疗文件识别（支持多文件上传）</h2>
            <div class="medical-upload-section">
                <div class="form-group">
                    <label>上传医疗文件（自动识别数据）</label>
                    <div class="upload-area" id="uploadArea">
                        <input type="file" id="medicalImage" accept=".pdf,.doc,.docx,.xls,.xlsx,image/*" multiple hidden>
                        <p>拖拽文件到此或<span class="upload-link">点击选择</span></p>
                        <p style="font-size: 12px; color: #888;">支持图片（JPG/PNG）、PDF、Word、Excel格式，可选择多个文件，最大50MB</p>
                    </div>
                </div>
                <div class="form-group">
                    <label>文档类型</label>
                    <select id="documentType">
                        <option value="血液检查">血液检查</option>
                        <option value="病历记录">病历记录</option>
                        <option value="体检报告">体检报告</option>
                        <option value="检查报告">检查报告</option>
                    </select>
                </div>
                <div id="uploadStatus"></div>
            </div>
        </div>

        <!-- 已上传的文件 -->
        <div class="card">
            <div class="uploaded-images">
                <div class="images-title">📄 最近上传的文件（点击文件查看识别内容）</div>
                <div class="images-list" id="uploadedImagesList"></div>
            </div>
        </div>

        <!-- 识别内容展示区域 -->
        <div id="recognitionResultsArea"></div>

        <div class="card">
            <div class="card-header">
                <h2>客户列表</h2>
                <button id="testWxNotify" class="secondary">测试微信通知</button>
            </div>
            <div id="clientList"></div>
        </div>

        <div class="status" id="status"></div>
    </div>

    <script src="app.js"></script>
    <script src="medicalClient.js"></script>
    <script>
        // 检查登录状态
        async function checkAuth() {
            try {
                const response = await fetch('/api/auth/status');
                const data = await response.json();
                if (!data.authenticated) {
                    window.location.href = '/login.html';
                }
            } catch (error) {
                console.error('认证检查失败:', error);
            }
        }

        // 登出功能
        async function logout() {
            if (confirm('确定要登出吗？')) {
                try {
                    const response = await fetch('/api/logout', {
                        method: 'POST'
                    });
                    const data = await response.json();
                    if (data.success) {
                        window.location.href = '/login.html';
                    }
                } catch (error) {
                    console.error('登出失败:', error);
                }
            }
        }

        // 页面加载时检查认证
        checkAuth();
    </script>
</body>
</html>
