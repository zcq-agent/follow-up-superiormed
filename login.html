<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 张楚乔医生客户随访管理</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                         "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #0d1117 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            opacity: 0.4;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(0, 255, 255, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(138, 43, 226, 0.06) 0%, transparent 50%);
            pointer-events: none;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            background: rgba(13, 17, 23, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 20px;
            box-shadow:
                0 0 0 1px rgba(0, 255, 255, 0.1),
                0 20px 60px rgba(0, 0, 0, 0.5),
                0 0 40px rgba(0, 255, 255, 0.1);
            position: relative;
            z-index: 10;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg,
                transparent,
                rgba(0, 255, 255, 0.8),
                rgba(138, 43, 226, 0.8),
                transparent);
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-mark {
            width: 60px;
            height: 60px;
            margin: 0 auto 20px;
            border-radius: 16px;
            background: linear-gradient(135deg, #00ffff 0%, #8a2be2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            color: #000;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
        }

        .login-header h1 {
            font-size: 24px;
            font-weight: 600;
            background: linear-gradient(90deg, #00ffff, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .login-header p {
            font-size: 13px;
            color: rgba(0, 255, 255, 0.6);
            letter-spacing: 0.1em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #00ffff;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .form-group label::before {
            content: '> ';
            opacity: 0.7;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 10px;
            font-size: 15px;
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            transition: all 0.3s ease;
            box-shadow:
                0 0 0 1px rgba(0, 255, 255, 0.1),
                inset 0 1px 3px rgba(0, 0, 0, 0.3);
        }

        .form-group input::placeholder {
            color: rgba(0, 255, 255, 0.3);
        }

        .form-group input:focus {
            outline: none;
            border-color: #00ffff;
            background: rgba(0, 20, 30, 0.6);
            box-shadow:
                0 0 0 1px rgba(0, 255, 255, 0.3),
                0 0 20px rgba(0, 255, 255, 0.2),
                inset 0 1px 3px rgba(0, 0, 0, 0.3);
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00ffff 0%, #0099ff 50%, #8a2be2 100%);
            background-size: 200% 200%;
            border: none;
            border-radius: 12px;
            color: #000;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow:
                0 0 20px rgba(0, 255, 255, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.5s ease;
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow:
                0 0 30px rgba(0, 255, 255, 0.6),
                0 0 60px rgba(0, 255, 255, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .error-message {
            min-height: 24px;
            margin-top: 16px;
            text-align: center;
            font-size: 13px;
            color: #ff5080;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .error-message.show {
            opacity: 1;
        }

        .footer-text {
            margin-top: 24px;
            text-align: center;
            font-size: 11px;
            color: rgba(0, 255, 255, 0.4);
            letter-spacing: 0.05em;
        }

        .loading {
            position: relative;
            pointer-events: none;
            opacity: 0.7;
        }

        .loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            margin: -10px 0 0 -10px;
            border: 2px solid transparent;
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .corner-decor {
            position: absolute;
            width: 20px;
            height: 20px;
        }

        .corner-decor.top-left {
            top: -1px;
            left: -1px;
            border-top: 2px solid #00ffff;
            border-left: 2px solid #00ffff;
        }

        .corner-decor.bottom-right {
            bottom: -1px;
            right: -1px;
            border-bottom: 2px solid #00ffff;
            border-right: 2px solid #00ffff;
        }

        .tech-lines {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 0;
        }

        .tech-lines::before,
        .tech-lines::after {
            content: '';
            position: absolute;
        }

        .tech-lines::before {
            top: 20%;
            left: 10%;
            width: 100px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.5), transparent);
        }

        .tech-lines::after {
            bottom: 30%;
            right: 15%;
            width: 80px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(138, 43, 226, 0.5), transparent);
        }
    </style>
</head>
<body>
    <div class="tech-lines"></div>

    <div class="login-container">
        <div class="corner-decor top-left"></div>
        <div class="corner-decor bottom-right"></div>

        <div class="login-header">
            <div class="logo-mark">Z</div>
            <h1>张楚乔医生</h1>
            <p>客户随访管理系统</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="password">访问密码</label>
                <input type="password" id="password" placeholder="输入密码..." autocomplete="current-password" required>
            </div>

            <button type="submit" class="login-btn">
                <span>登 录</span>
            </button>
        </form>

        <div class="error-message" id="errorMessage"></div>

        <div class="footer-text">
            // SECURE ACCESS REQUIRED //
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const passwordInput = document.getElementById('password');
        const errorMessage = document.getElementById('errorMessage');
        const submitBtn = form.querySelector('.login-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = passwordInput.value;
            if (!password) {
                showError('请输入密码');
                return;
            }

            submitBtn.classList.add('loading');
            submitBtn.disabled = true;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const result = await response.json();

                if (result.success) {
                    window.location.href = '/index.html';
                } else {
                    showError(result.message || '登录失败');
                }
            } catch (error) {
                showError('网络错误，请稍后重试');
            } finally {
                submitBtn.classList.remove('loading');
                submitBtn.disabled = false;
            }
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 3000);
        }

        // 页面加载时检查是否已登录
        fetch('/api/auth/status')
            .then(res => res.json())
            .then(data => {
                if (data.authenticated) {
                    window.location.href = '/index.html';
                }
            })
            .catch(() => {});

        // 回车键登录
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                form.dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
